<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Continuar</title></head><body style="font-family:-apple-system,sans-serif;background:#f4f7fb;min-height:100vh;display:grid;place-items:center;margin:0"><div style="background:#fff;padding:28px;border-radius:20px;text-align:center"><h2>Continuar</h2><p id="msg">Preparando enlace…</p><a id="go" style="display:none;padding:12px 16px;background:#0f3d68;color:white;border-radius:12px;text-decoration:none">Abrir</a></div><script>const raw=new URLSearchParams(location.search).get('url');const a=document.getElementById('go');const m=document.getElementById('msg');try{const u=new URL(raw);if(u.protocol==='https:'&&u.hostname==='seguimiento-peso.vercel.app'){a.href=u.href;a.style.display='inline-block';m.textContent='Toca Abrir para continuar.'}else m.textContent='Destino no válido.'}catch{m.textContent='Enlace incompleto.'}</script></body></html>
